[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnflow"
version = "0.1.0"
description = "ML-based elephant/mice flow classification in SDN"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "joblib>=1.3",
    "pandas>=2.0",
    "rich>=13.0",
    "scapy>=2.5",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
mn-pcap-to-dataset = "mnflow.pcap_to_flow_dataset:main"
mn-train = "mnflow.train_model:main"
mn-train-security = "mnflow.train_security:main"
mn-predict = "mnflow.predict_flow:main"
mn-evaluate = "mnflow.evaluate_model:main"
mn-report = "mnflow.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
# pox/ must stay importable by old Python 2 based POX installs: no f-strings.
"pox/**" = ["BLE001", "UP032"]
